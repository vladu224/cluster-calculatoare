[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-client"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["grpcio", "protobuf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auth_client = ["*.pyi"]