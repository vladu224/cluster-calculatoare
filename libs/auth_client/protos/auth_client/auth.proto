syntax = "proto3";

package auth;

service AuthService {
  rpc Login (LoginRequest) returns (TokenResponse);
  rpc ListUsers (TokenRequest) returns (UserList);
  rpc CreateUser (CreateUserRequest) returns (OperationResponse);
  rpc DeactivateUser (DeactivateUserRequest) returns (OperationResponse);
  rpc ActivateUser (ActivateUserRequest) returns (OperationResponse);
  rpc ValidateToken (TokenRequest) returns (TokenClaims);
  rpc DestroyToken (TokenRequest) returns (OperationResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ADMINISTRATOR = 1;
  MAINTAINER = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message TokenRequest {
  string token = 1;
}

message TokenResponse {
  string token = 1;
}

message User {
  string uid = 1;
  string username = 2;
  Role role = 3;
  bool is_active = 4;
}

message UserList {
  repeated User users = 1;
}

message CreateUserRequest {
  string token = 1;
  string username = 2;
  Role role = 3;
}

message DeactivateUserRequest {
  string token = 1;
  string username = 2;
}

message ActivateUserRequest {
  string username = 1;
  string password = 2;
}

message TokenClaims {
  string sub = 1;
  string username = 2;
  Role role = 3;
  
}

message OperationResponse {
  bool success = 1;
  string message = 2;
}